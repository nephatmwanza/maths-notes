<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WJ Maths</title>
<!--
  GitHub Pages serves this repository from its root, but the catalogue lives in
  site/. Every other path in the project is relative and already correct when
  served from the root, so a redirect here is all that is needed - no build
  step, no Actions workflow, nothing else to go wrong.

  The meta refresh is the fallback for when JavaScript is off; the script runs
  first and keeps the redirect out of the browser's history, so Back returns to
  wherever the reader came from rather than bouncing them forward again.
-->
<meta http-equiv="refresh" content="0; url=site/index.html">
<link rel="canonical" href="site/index.html">
<script>location.replace("site/index.html");</script>
</head>
<body>
<p>Redirecting to <a href="site/index.html">WJ Maths</a>.</p>
</body>
</html>
