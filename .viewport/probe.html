<!doctype html><meta charset=utf-8><body><pre id=out>…</pre>
<script>
const fr=document.createElement('iframe');
fr.style.cssText='width:1400px;height:9000px;border:0;position:absolute;left:-9999px';
fr.src='../courses/introduction-to-probability/build/intro_probse12.html';
document.body.appendChild(fr);
fr.onload=async()=>{ await new Promise(r=>setTimeout(r,4000));
  const d=fr.contentDocument,o=[];
  d.querySelectorAll('.caption,figcaption,div.caption').forEach(c=>{
    const txt=c.textContent.trim().replace(/\s+/g,' ').slice(0,60);
    if(/2\.2[6-9]|2\.3[0-2]/.test(txt)) o.push(Math.round(c.getBoundingClientRect().top)+'  '+txt);
  });
  document.getElementById('out').textContent=o.join('\n')||'none'; };
</script>
