<!doctype html><meta charset=utf-8><title>overflow check</title>
<body><pre id=out>running…</pre>
<script>
// Loads every built page in turn and reports any element whose content is wider
// than its box - i.e. anything the reader would have to scroll sideways to see.
const pages = [...Array(20).keys()].map(i => `intro_probse${i+1}.html`)
  .concat(['intro_prob.html','intro_probli1.html','intro_probch1.html',
           'intro_probch2.html','intro_probch3.html']);
const base = '../courses/introduction-to-probability/build/';
const out = document.getElementById('out');
const lines = [];
(async () => {
  for (const p of pages) {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:1400px;height:900px;border:0;position:absolute;left:-9999px';
    fr.src = base + p;
    document.body.appendChild(fr);
    const ok = await new Promise(r => { fr.onload = () => r(true); fr.onerror = () => r(false); });
    if (!ok) { fr.remove(); continue; }
    await new Promise(r => setTimeout(r, 1800));   // let MathJax typeset
    const d = fr.contentDocument;
    if (d) {
      // Ignore MathJax's hidden accessibility MathML and its internal table
      // boxes - they are visually hidden or off by a rounding pixel, and they
      // drown out the overflows that a reader would actually see.
      const noise = /^(mjx-assistive-mml|math|mjx-dbox|mjx-dtable|mtable|mtr|mtd|mjx-mrow|semantics|mrow)$/;
      for (const el of d.querySelectorAll('.inner *')) {
        if (noise.test(el.tagName.toLowerCase())) continue;
        const over = el.scrollWidth - el.clientWidth;
        const scrolls = getComputedStyle(el).overflowX === 'auto';
        if (over > 2 && el.clientWidth > 0) {
          if (scrolls) { lines.push(`${p}  ${el.tagName.toLowerCase()}  scrollable +${over}px (ok)`); continue; }
          // A numbered equation's tag is positioned in the right margin on
          // purpose - that is where a book puts it. It widens the parent's
          // scrollWidth without anything being clipped, so don't report it.
          const lab = el.querySelector('mjx-labels');
          if (lab && over <= lab.getBoundingClientRect().width + 8) {
            lines.push(`${p}  ${el.tagName.toLowerCase()}  equation tag in margin +${over}px (ok)`);
            continue;
          }
          lines.push(`${p}  ${el.tagName.toLowerCase()}.${(el.className||'').toString().slice(0,28)}  +${over}px`);
        }
      }
      const b = d.documentElement;
      if (b.scrollWidth - b.clientWidth > 2)
        lines.push(`${p}  *** PAGE scrolls horizontally +${b.scrollWidth-b.clientWidth}px`);
    }
    fr.remove();
  }
  out.textContent = lines.length ? lines.join('\n') : 'CLEAN - nothing overflows';
  document.title = 'done';
})();
</script>
