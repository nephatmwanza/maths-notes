# Publish the site to GitHub Pages.
name: Deploy site to GitHub Pages

# Why this exists rather than "Deploy from a branch":
#
# The branch option runs GitHub's jekyll-build-pages action over the repository,
# and its "Build with Jekyll" step failed on every push here. Adding .nojekyll
# did not help - the step still ran and still failed - and the build log is not
# readable without a token, so the failure could not be diagnosed from outside.
#
# Nothing in this project wants Jekyll. The HTML is generated by
# site/make-course.sh and must be served byte-for-byte as written. So this
# workflow skips the build step entirely and uploads the repository as static
# files. It is also visible and version-controlled, which the branch option is
# not: when a deploy fails, the reason is in the run log rather than hidden
# behind a settings page.

on:
  push:
    branches: [main]
  workflow_dispatch:      # so a deploy can be re-run without an empty commit

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the built pages are missing
        # The generated HTML is committed, so an empty build directory means
        # someone pushed source without running site/make-course.sh. Better to
        # fail here than to publish a site with no course in it.
        run: |
          count=$(ls courses/*/build/*.html 2>/dev/null | wc -l)
          echo "found $count built pages"
          test "$count" -gt 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
